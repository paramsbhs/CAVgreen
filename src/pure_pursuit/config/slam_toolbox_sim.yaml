slam_toolbox:
  ros__parameters:
    # --- Frames (sim-specific) ---
    # The gym bridge publishes ground-truth TF map -> ego_racecar/base_link
    # and provides no odom frame. We treat that ground-truth chain as perfect
    # odometry (odom_frame: map) and let slam_toolbox own its OWN map frame
    # (slam_map), so it never fights the bridge over TF. On hardware use
    # slam_toolbox_hardware.yaml instead (standard map/odom/base_link).
    map_frame: slam_map
    odom_frame: map
    base_frame: ego_racecar/base_link
    scan_topic: /scan

    mode: mapping
    use_sim_time: false

    # --- Solver ---
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # --- Mapping ---
    resolution: 0.05
    max_laser_range: 10.0          # gym lidar is clean; 10 m keeps the graph tight
    map_update_interval: 2.0
    transform_publish_period: 0.02
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    minimum_time_interval: 0.2
    minimum_travel_distance: 0.25
    minimum_travel_heading: 0.17   # ~10 deg
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 10.0

    # --- Scan matching / loop closure ---
    # OFF in sim: gym odometry is ground truth, and the synthetic map's
    # featureless straight walls give correlative matching nothing to grip —
    # it slips along the corridor axis and corrupts perfect poses ("ghost
    # walls"). Hardware config keeps matching ON: real odometry drifts and
    # real corridors have texture.
    use_scan_matching: false
    use_scan_barycenter: true
    do_loop_closing: true
    loop_search_maximum_distance: 4.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # correlation search space
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # penalties — high odometry trust: long corridors are feature-poor along
    # their axis and the scan matcher slips longitudinally ("ghost walls")
    # if allowed to override odometry freely.
    distance_variance_penalty: 0.9
    angle_variance_penalty: 1.8
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
