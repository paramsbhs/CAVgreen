pure_pursuit_node:
  ros__parameters:
    # Hardware: start conservative. Particle-filter pose is noisier and
    # ~25 Hz, so use a longer lookahead than sim to avoid oscillation.
    lookahead_distance: 1.8
    lookahead_gain: 0.5
    lookahead_min: 1.2
    lookahead_max: 2.5

    max_steering_angle: 0.4189

    # Vehicle envelope is race-proven to 6.5 m/s (wall_follow competition
    # config with ttc 0.35 active). Pure pursuit adds particle-filter pose
    # noise/latency the racers didn't have, so start mid-envelope and raise
    # velocity_scale once tracking error looks clean in RViz.
    velocity_scale: 1.0
    max_speed: 3.5
    fallback_speed: 2.0

    publish_markers: true
