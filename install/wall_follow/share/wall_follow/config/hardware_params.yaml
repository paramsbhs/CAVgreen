wall_follow_node:
  ros__parameters:
    # PID gains - tuned for simulation, must be re-tuned on hardware
    # Start with these conservative values and adjust:
    #   - Increase kp if car is slow to correct
    #   - Increase kd to damp oscillation around corners
    #   - Leave ki at 0.0 until kp/kd are stable
    kp: 0.1
    ki: 0.0
    kd: 0.05

    # Target distance from wall in metres
    desired_distance: 0.8

    # Lookahead distance for heading prediction in metres
    # Smaller = more reactive, larger = smoother but slower to correct
    lookahead_L: 1.4

    # Angle between the two LiDAR beams used for wall distance estimation (degrees)
    theta: 45.0

    # Speed tiers (m/s) — selected by steering demand.
    # For first hardware runs, keep these low until PID is tuned.
    speed_straight: 6.5
    speed_mild: 3.5
    speed_sharp: 3.3

    # Steering thresholds (radians) that select speed tiers.
    # abs(steer) < mild  → speed_straight
    # abs(steer) < sharp → speed_mild
    # else               → speed_sharp
    steer_thresh_mild: 0.09
    steer_thresh_sharp: 0.2

    # Derivative low-pass filter coefficient (0.0–1.0).
    # Lower = heavier smoothing (less noise, more lag).
    # 0.3 is a good starting point for noisy LiDAR.
    derivative_filter_alpha: 0.20
